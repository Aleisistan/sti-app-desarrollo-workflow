# k8s/backend.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nest-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nest-backend
  template:
    metadata:
      labels:
        app: nest-backend
    spec:
      containers:
      - name: nestjs
        # IMAGEN: Debe coincidir con el nombre que usas en el comando 'docker build'
        image: mi-backend:ci
        
        # IMPORTANTE: Esto obliga a Kubernetes a usar la imagen que construiste 
        # localmente en Minikube y NO intentar descargarla de internet.
        imagePullPolicy: Never 
        
        ports:
        - containerPort: 3000
        
        env:
        # Inyectamos la URL de Supabase desde el secreto creado en el pipeline
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DATABASE_URL
              
        resources:
          # RECURSOS AJUSTADOS PARA GITHUB ACTIONS
          # Pedimos muy poca CPU (0.05 core) para que:
          # 1. Quepa en el servidor gratuito.
          # 2. Se sature rápido con poco tráfico y active el escalado.
          requests:
            cpu: "50m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "512Mi"

        # Opcional: Espera a que NestJS arranque antes de enviar tráfico
        startupProbe:
          httpGet:
            path: / # Asegúrate de tener una ruta GET / o cambia esto a /api
            port: 3000
          failureThreshold: 15
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: nest-backend-service
spec:
  selector:
    app: nest-backend
  ports:
    - protocol: TCP
      port: 80       # Puerto dentro del clúster
      targetPort: 3000 # Puerto de tu NestJS
  type: NodePort