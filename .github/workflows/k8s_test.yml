name: K8s Integration & Load Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  k8s-minikube-test:
    runs-on: ubuntu-latest
    name: Test Kubernetes Scaling
    steps:
      # 1. Bajar el código
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Levantar Minikube dentro del Runner de GitHub
      - name: Start Minikube
        uses: medyagh/setup-minikube@master
        with:
          addons: metrics-server # Vital para el HPA

      # 3. Construir imagen Docker del Backend DIRECTAMENTE en Minikube
      - name: Build Backend Image in Minikube
        run: |
          export MINIKUBE_IN_STYLE=false
          eval $(minikube -p minikube docker-env)
          docker build -t mi-backend:ci -f ./k8s/backend 
          # Asegúrate que la ruta al Dockerfile sea correcta

      # 4. Crear Secretos de K8s usando los Secretos de GitHub
      - name: Create K8s Secrets
        run: |
          kubectl create secret generic db-credentials \
          --from-literal=DATABASE_URL='${{ secrets.SUPABASE_URL }}'

      # 5. Aplicar configuraciones (Backend y HPA)
      - name: Deploy to Minikube
        run: |
          # Modificamos el deployment para usar la imagen local 'mi-backend:ci'
          sed -i 's|image: .*|image: mi-backend:ci|' k8s/backend.yaml
          sed -i 's|imagePullPolicy: .*|imagePullPolicy: Never|' k8s/backend.yaml
          
          #aplico el deployment
          kubectl apply -f k8s/backend.yaml

          # Forzar recursos MUY bajos dinámicamente. 
          # Esto evita que modifiques tu archivo yaml original y protege la memoria del runner.
          # Request 50m: Significa que el pod pide solo 0.05 de CPU.
          kubectl set resources deployment nest-backend --requests=cpu=50m,memory=128Mi --limits=cpu=250m,memory=256Mi
          
          # Configuramos el Autoscaler (si no está en un yaml aparte)
          kubectl autoscale deployment nest-backend --cpu-percent=10 --min=1 --max=5

      # 6. Esperar a que el pod inicial arranque
      - name: Wait for Pod Ready
        run: |
          kubectl wait --for=condition=ready pod -l app=nest-backend --timeout=120s

      # 7. PRUEBA DE CARGA (La simulación de tráfico)
      - name: Run Load Test & Verify Scaling
        run: |
          echo "Iniciando generador de tráfico..."
          # Lanzamos un pod generador de carga en background
          kubectl run load-generator --image=busybox --restart=Never -- /bin/sh -c "while true; do wget -q -O- http://nest-backend-service; done" &
          
          echo "Esperando 2 minutos para que el HPA reaccione..."
          sleep 120
          
          echo "Verificando réplicas..."
          REPLICAS=$(kubectl get deployment nest-backend -o jsonpath='{.status.replicas}')
          echo "Réplicas actuales: $REPLICAS"
          
          if [ "$REPLICAS" -gt 1 ]; then
            echo "¡ÉXITO! El sistema ha escalado automáticamente."
          else
            echo "FALLO: El sistema no ha escalado. Revisa los límites de CPU."
            exit 1
          fi

      # 8. (Opcional) Si todo pasa, avisar a Render para que despliegue
      - name: Trigger Render Deploy
        if: success() && github.ref == 'refs/heads/main'
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
