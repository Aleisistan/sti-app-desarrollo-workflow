name: Full Stack K8s Scaling Test

on:
  push:
    branches: [ "main" ]

jobs:
  test-k8s:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Start Minikube
        uses: medyagh/setup-minikube@master
        with:
          addons: metrics-server

      - name: Setup Docker Env
        run: eval $(minikube -p minikube docker-env)

      # --- DIAGNÓSTICO DE FRONTEND ---
      - name: Debug Frontend Files
        run: |
          echo "📂 Listando estructura de carpetas:"
          ls -R frontend/ # O donde tengas tu código
          # Esto te ayudará a ver si 'dist' se genera bien

      - name: Build Images
        run: |
          export MINIKUBE_IN_STYLE=false
          eval $(minikube -p minikube docker-env)
          
          # Backend
          docker build -t mi-backend:test -f ./k8s/backend/Dockerfile backend
          
          # Frontend (Asegúrate que el Dockerfile copie los archivos compilados correctamente)
          # Si tu build de angular falla, el contenedor se crea vacío y Nginx crashea.
          docker build -t mi-frontend:test -f ./k8s/frontend/Dockerfile frontend

      # --- DESPLIEGUE INFALIBLE DE DB ---
      - name: Deploy Database
        run: |
          kubectl create secret generic db-credentials \
            --from-literal=DATABASE_URL='postgres://testuser:testpass@postgres-db:5432/testdb'

          cat <<EOF > postgres-db.yaml
          apiVersion: v1
          kind: Service
          metadata:
            name: postgres-db
          spec:
            ports:
            - port: 5432
            selector:
              app: postgres-db
            type: ClusterIP
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: postgres-db
          spec:
            selector:
              matchLabels:
                app: postgres-db
            template:
              metadata:
                labels:
                  app: postgres-db
              spec:
                containers:
                - name: postgres
                  image: postgres:15-alpine
                  ports:
                  - containerPort: 5432
                  env:
                  - name: POSTGRES_PASSWORD
                    value: "testpass"
                  - name: POSTGRES_USER
                    value: "testuser"
                  - name: POSTGRES_DB
                    value: "testdb"
                  resources:
                    requests:
                      memory: "256Mi"
                      cpu: "250m"
          EOF
          kubectl apply -f postgres-db.yaml

      # --- NUEVO: ESPERA ACTIVA DE RED (SOLUCIÓN A ECONNREFUSED) ---
      - name: Wait for DB TCP Port
        run: |
          echo "⏳ Esperando a que Postgres acepte conexiones TCP..."
          # Lanzamos un pod 'desechable' que intenta conectar al puerto 5432 cada 2 segundos
          # Si falla tras 120s, el pipeline se detiene aquí.
          kubectl run wait-for-postgres --image=busybox --restart=Never --timeout=120s -- \
            sh -c 'until nc -z postgres-db 5432; do echo "Esperando DB..."; sleep 2; done'
          
          # Esperamos a que ese pod termine exitosamente
          kubectl wait --for=condition=completed pod/wait-for-postgres --timeout=120s
          
          # Limpiamos
          kubectl delete pod wait-for-postgres

      # --- DESPLIEGUE APPS ---
      - name: Deploy Apps (Using Repo Files)
        run: |
          # 1. Adaptar BACKEND
          sed -i 's|image: .*|image: mi-backend:test|' k8s/backend.yml
          sed -i 's|imagePullPolicy: .*|imagePullPolicy: Never|' k8s/backend.yml
          
          kubectl apply -f k8s/backend.yml
          
          # Forzamos recursos bajos y entorno DEV
          kubectl set resources deployment nest-backend --requests=cpu=50m,memory=128Mi --limits=cpu=500m
          kubectl set env deployment/nest-backend NODE_ENV=development

          # 2. Adaptar FRONTEND
          sed -i 's|image: .*|image: mi-frontend:test|' k8s/frontend.yml
          sed -i 's|imagePullPolicy: .*|imagePullPolicy: Never|' k8s/frontend.yml

          kubectl apply -f k8s/frontend.yml
          
          # Configurar HPA
          kubectl autoscale deployment nest-backend --cpu-percent=10 --min=1 --max=5

      - name: Wait for Pods & Debug
        run: |
          echo "Esperando pods..."
          # Damos más tiempo por si acaso
          kubectl wait --for=condition=ready pod -l app=nest-backend --timeout=300s || (echo "❌ Backend falló" && kubectl logs -l app=nest-backend --all-containers --tail=100 && exit 1)
          
          # Si el frontend falla, mostramos logs pero NO rompemos el pipeline (para que veas el backend escalar)
          kubectl wait --for=condition=ready pod -l app=angular-frontend --timeout=120s || (echo "⚠️ Frontend falló, revisa tu Dockerfile" && kubectl logs -l app=angular-frontend --tail=20)

      - name: Stress Test
        run: |
          echo "🔥 Iniciando Load Test..."
          kubectl run load-gen --image=busybox --restart=Never -- /bin/sh -c "while true; do wget -q -O- http://nest-backend-service; done" &
          sleep 90
          REPLICAS=$(kubectl get deployment nest-backend -o jsonpath='{.status.replicas}')
          echo "📈 Réplicas finales: $REPLICAS"
          if [ "$REPLICAS" -gt 1 ]; then echo "✅ ÉXITO"; else echo "❌ FALLO"; exit 1; fi