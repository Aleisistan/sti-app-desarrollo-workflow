name: Full Stack K8s Scaling Test (Frontend + Backend)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  full-stack-test:
    runs-on: ubuntu-latest
    name: Test Architecture & Scaling
    steps:
      # 1. Bajar el código del repositorio
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Iniciar Minikube con Metrics Server (Vital para el HPA)
      - name: Start Minikube
        uses: medyagh/setup-minikube@master
        with:
          addons: metrics-server

      # 3. Configurar entorno Docker para usar el demonio de Minikube
      - name: Setup Minikube Docker Env
        run: |
          eval $(minikube -p minikube docker-env)

      # 4. Construir Imágenes Docker (Backend y Frontend)
      - name: Build Images inside Minikube
        run: |
          # Importante para que use el docker de minikube
          export MINIKUBE_IN_STYLE=false
          eval $(minikube -p minikube docker-env)
          
          echo "🔨 Construyendo Backend..."
          # AJUSTA LA RUTA SI TU DOCKERFILE NO ESTÁ EN LA RAÍZ
          # Ejemplo: docker build -t mi-backend:test -f ./backend/Dockerfile ./backend
          docker build -t mi-backend:test -f ./k8s/backend/Dockerfile backend 
          
          echo "🔨 Construyendo Frontend..."
          # AJUSTA LA RUTA A TU CARPETA DE ANGULAR
          # Ejemplo: docker build -t mi-frontend:test -f ./frontend/Dockerfile ./frontend
          docker build -t mi-frontend:test -f ./k8s/frontend/Dockerfile frontend

      # 5. Desplegar Base de Datos EFÍMERA (Trampa para simular conexión)
      - name: Deploy Ephemeral Postgres
        run: |
          echo "🚀 Desplegando Postgres temporal..."
          # Creamos el servicio y deployment de la DB
          cat <<EOF > postgres-db.yml
          apiVersion: v1
          kind: Service
          metadata:
            name: postgres-db
          spec:
            ports:
            - port: 5432
            selector:
              app: postgres-db
            type: ClusterIP
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: postgres-db
          spec:
            selector:
              matchLabels:
                app: postgres-db
            template:
              metadata:
                labels:
                  app: postgres-db
              spec:
                containers:
                - name: postgres
                  image: postgres:15-alpine
                  ports:
                  - containerPort: 5432
                  env:
                  - name: POSTGRES_PASSWORD
                    value: "testpass"
                  - name: POSTGRES_USER
                    value: "testuser"
                  - name: POSTGRES_DB
                    value: "testdb"
          EOF
          
          kubectl apply -f postgres-db.yml
          
          echo "⏳ Esperando a que la DB arranque y acepte conexiones..."
          kubectl wait --for=condition=ready pod -l app=postgres-db --timeout=60s
          sleep 20 # Pausa de seguridad para evitar Connection Refused inicial

      # 6. Desplegar usando TUS archivos del repositorio
      - name: Deploy Apps (Using Repo Files)
        run: |
          # 1. Crear el Secreto FALSO que espera tu backend.yaml
          # Esto engaña a tu backend para que se conecte a la DB efímera de la prueba
          kubectl create secret generic db-credentials \
            --from-literal=DATABASE_URL='postgres://testuser:testpass@postgres-db:5432/testdb' \
            --dry-run=client -o yaml | kubectl apply -f -

          # 2. Modificar BACKEND.YAML al vuelo (sin cambiar el archivo original del repo)
          # Cambiamos la imagen por la de prueba y forzamos que no busque en internet
          sed -i 's|image: .*|image: mi-backend:test|' k8s/backend.yml
          sed -i 's|imagePullPolicy: .*|imagePullPolicy: Never|' k8s/backend.yml
          
          # Aplicamos el backend
          kubectl apply -f k8s/backend.yml
          
          # CRÍTICO: Sobrescribimos los recursos para el entorno de GitHub Actions
          # Si tu archivo original pide mucha CPU, GitHub matará el proceso.
          # Aquí forzamos que sea muy ligero para la prueba.
          kubectl set resources deployment nest-backend --requests=cpu=50m,memory=128Mi --limits=cpu=250m,memory=512Mi
          
          # Forzamos variable de entorno NODE_ENV development para evitar errores SSL con la DB falsa
          kubectl set env deployment/nest-backend NODE_ENV=development

          # 3. Modificar FRONTEND.YAML al vuelo
          sed -i 's|image: .*|image: mi-frontend:test|' k8s/frontend.yml
          sed -i 's|imagePullPolicy: .*|imagePullPolicy: Never|' k8s/frontend.yml

          # Aplicamos el frontend
          kubectl apply -f k8s/frontend.yml

          # 4. Configurar HPA (Auto-escalado)
          # Esto es igual, necesitamos alta sensibilidad para el test
          kubectl autoscale deployment nest-backend --cpu-percent=10 --min=1 --max=5

      # 7. Esperar a que todo esté listo (Con Debug si falla)
      - name: Wait for Pods Ready
        id: wait-pods
        run: |
          echo "Esperando Backend..."
          kubectl wait --for=condition=ready pod -l app=nest-backend --timeout=180s
          
          echo "Esperando Frontend..."
          kubectl wait --for=condition=ready pod -l app=angular-frontend --timeout=120s

      # 8. DEBUG (Solo corre si falla el paso anterior)
      - name: Debug Failure
        if: failure()
        run: |
          echo "🔴 ALGO FALLÓ. DIAGNÓSTICO:"
          kubectl get pods
          echo "--- LOGS BACKEND ---"
          kubectl logs -l app=nest-backend --tail=50 --all-containers=true
          echo "--- LOGS FRONTEND ---"
          kubectl logs -l app=angular-frontend --tail=20 --all-containers=true

      # 9. PRUEBA DE CARGA (Stress Test)
      - name: Stress Test & Verify Scaling
        if: success()
        run: |
          echo "🔥 Iniciando Load Test al Backend..."
          # Lanzamos tráfico al servicio del backend
          kubectl run load-gen --image=busybox --restart=Never -- /bin/sh -c "while true; do wget -q -O- http://nest-backend-service; done" &
          
          echo "⏳ Esperando 90 segundos para que el HPA reaccione..."
          sleep 90
          
          echo "📊 Reporte Final:"
          kubectl get hpa
          REPLICAS=$(kubectl get deployment nest-backend -o jsonpath='{.status.replicas}')
          echo "📈 Réplicas actuales: $REPLICAS"
          
          if [ "$REPLICAS" -gt 1 ]; then
            echo "✅ PRUEBA EXITOSA: El sistema escaló correctamente."
          else
            echo "❌ FALLO: El sistema no escaló. Revisa configuración."
            exit 1
          fi