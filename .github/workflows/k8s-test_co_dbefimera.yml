name: Full Stack K8s Scaling Test

on:
  push:
    branches: [ "main" ]

jobs:
  full-stack-test:
    runs-on: ubuntu-latest
    name: Test Scaling Architecture
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Start Minikube
        uses: medyagh/setup-minikube@master
        with:
          addons: metrics-server

      - name: Setup Docker Env
        run: eval $(minikube -p minikube docker-env)

      # 1. CONSTRUIR IMÁGENES
      - name: Build Images inside Minikube
        run: |
          export MINIKUBE_IN_STYLE=false
          eval $(minikube -p minikube docker-env)
          
          echo "🔨 Construyendo Backend..."
          docker build -t mi-backend:test -f ./k8s/backend/Dockerfile backend
          
          echo "🔨 Construyendo Frontend (Nginx)..."
          # Asegúrate de haber actualizado el Dockerfile como te indiqué arriba
          docker build -t mi-frontend:test -f ./k8s/frontend/Dockerfile frontend

      # 2. DESPLEGAR DATABASE (Con Debug)
      - name: Deploy Database
        run: |
          echo "🚀 Desplegando Postgres..."
          # Definición directa del servicio y deployment
          cat <<EOF > postgres-db.yaml
          apiVersion: v1
          kind: Service
          metadata:
            name: postgres-db
          spec:
            ports:
            - port: 5432
            selector:
              app: postgres-db
            type: ClusterIP
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: postgres-db
          spec:
            selector:
              matchLabels:
                app: postgres-db
            template:
              metadata:
                labels:
                  app: postgres-db
              spec:
                containers:
                - name: postgres
                  image: postgres:15-alpine
                  ports:
                  - containerPort: 5432
                  env:
                  - name: POSTGRES_PASSWORD
                    value: "testpass"
                  - name: POSTGRES_USER
                    value: "testuser"
                  - name: POSTGRES_DB
                    value: "testdb"
                  resources:
                    requests:
                      memory: "128Mi" # Forzamos recursos bajos
                      cpu: "100m"
          EOF
          
          kubectl apply -f postgres-db.yaml
          
          echo "⏳ Esperando Pod de DB..."
          kubectl wait --for=condition=ready pod -l app=postgres-db --timeout=120s
          
          echo "💤 Durmiendo 15s para inicialización interna de Postgres..."
          sleep 15

      # 3. DIAGNÓSTICO DE DB (Solo si el paso anterior falló o si quieres verificar)
      - name: Check DB Logs if failed
        if: failure()
        run: |
          echo "❌ Algo falló con la DB. Mostrando logs:"
          kubectl logs -l app=postgres-db --all-containers=true
          kubectl describe pod -l app=postgres-db

      # 4. DESPLEGAR APPS (BACKEND + FRONTEND)
      - name: Deploy Full Stack
        run: |
          # --- SECRETOS ---
          kubectl create secret generic db-credentials \
            --from-literal=DATABASE_URL='postgres://testuser:testpass@postgres-db:5432/testdb'

          # --- BACKEND ---
          echo "🔧 Configurando Backend..."
          sed -i 's|image: .*|image: mi-backend:test|' k8s/backend.yaml
          sed -i 's|imagePullPolicy: .*|imagePullPolicy: Never|' k8s/backend.yml
          kubectl apply -f k8s/backend.yml
          
          # Ajustes críticos para CI
          kubectl set resources deployment nest-backend --requests=cpu=50m,memory=128Mi --limits=cpu=300m
          kubectl set env deployment/nest-backend NODE_ENV=development

          # --- FRONTEND ---
          echo "🔧 Configurando Frontend..."
          sed -i 's|image: .*|image: mi-frontend:test|' k8s/frontend.yml
          sed -i 's|imagePullPolicy: .*|imagePullPolicy: Never|' k8s/frontend.yml
          kubectl apply -f k8s/frontend.yml

          # --- HPA ---
          kubectl autoscale deployment nest-backend --cpu-percent=10 --min=1 --max=5

      # 5. ESPERAR A QUE ARRANQUEN
      - name: Wait for Pods Ready
        run: |
          echo "Esperando Backend..."
          # Si falla, muestra logs automáticamente
          kubectl wait --for=condition=ready pod -l app=nest-backend --timeout=180s || (kubectl logs -l app=nest-backend --all-containers --tail=50 && exit 1)
          
          echo "Esperando Frontend..."
          kubectl wait --for=condition=ready pod -l app=angular-frontend --timeout=120s || (kubectl logs -l app=angular-frontend --tail=50 && exit 1)

      # 6. PRUEBA DE ESTRÉS
      - name: Stress Test
        run: |
          echo "🔥 Iniciando Load Test..."
          kubectl run load-gen --image=busybox --restart=Never -- /bin/sh -c "while true; do wget -q -O- http://nest-backend-service; done" &
          
          echo "⏳ Generando tráfico por 60 segundos..."
          sleep 60
          
          REPLICAS=$(kubectl get deployment nest-backend -o jsonpath='{.status.replicas}')
          echo "📈 Réplicas actuales: $REPLICAS"
          
          if [ "$REPLICAS" -gt 1 ]; then
            echo "✅ PRUEBA EXITOSA: Escalado verificado."
          else
            echo "❌ FALLO: No escaló."
            exit 1
          fi